<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPTCHA Prototype Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 40px;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; color: #0f172a; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .widget-container {
      margin-bottom: 20px;
      width: 100%;
      height: 400px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .submit-btn {
      width: 100%;
      background: #94a3b8; /* Disabled state color */
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: not-allowed;
      transition: background 0.2s;
    }
    .submit-btn.enabled {
      background: #3b82f6;
      cursor: pointer;
    }
    .submit-btn.enabled:hover { background: #2563eb; }
    
    #payload-dump {
      margin-top: 30px;
      background: #1e293b;
      color: #10b981;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 800px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Sign Up</h2>
    
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" placeholder="you@example.com">
    </div>
    
    <div class="input-group">
      <label>Username</label>
      <input type="text" placeholder="Choose a username">
    </div>

    <!-- The Gamified CAPTCHA Widget -->
    <label>Verify you are human:</label>
    <div class="widget-container" id="widget">
      <!-- Notice the ?mode=captcha query parameter -->
      <!-- Added ?v=2 for cache-busting -->
      <iframe src="./index.html?mode=captcha&v=2" id="captcha-frame"></iframe>
    </div>

    <button class="submit-btn" id="submit-btn" disabled>Create Account</button>
  </div>

  <pre id="payload-dump"></pre>

  <script>
    const submitBtn = document.getElementById('submit-btn');
    const payloadDump = document.getElementById('payload-dump');
    let captchaToken = null;

    // Listen for the postMessage from the game iframe
    window.addEventListener('message', (event) => {
      // In production, verify the origin of the message!
      // if (event.origin !== 'https://oops-games.com') return;

      if (event.data && event.data.type === 'oops_captcha_solved') {
        console.log("Received CAPTCHA payload:", event.data);
        
        // The game successfully proved humanity
        captchaToken = event.data; // This would normally be a secure JWT
        
        // Enable the submit button
        submitBtn.classList.add('enabled');
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ Human Verified - Create Account";
        
        // Show the payload for demonstration purposes
        payloadDump.style.display = 'block';
        payloadDump.innerText = "// Raw Telemetry Payload received from iframe:\n" + JSON.stringify(event.data, null, 2);
      }
    });

    submitBtn.addEventListener('click', () => {
      if (!submitBtn.disabled) {
        alert("Account Created successfully! Security token included in request.");
      }
    });
  </script>
</body>
</html>
