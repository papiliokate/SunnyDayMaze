<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS App - Exporting Video...</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; margin: 0; padding: 40px; color: #1e293b; }
    .card { background: white; border-radius: 12px; padding: 30px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #2563eb; }
    #waiting-room-container { width: 100%; height: 600px; margin-top: 20px; display: none; }
    #status { margin-top: 20px; font-weight: bold; color: #64748b; }
  </style>
</head>
<body>
  <div class="card" id="app-card">
    <h1>Acme Video Editor</h1>
    <p>Your video is ready to be exported. This process usually takes about 10 seconds.</p>
    <button class="btn" id="start-btn">Start Export</button>
    <div id="status"></div>
    <div id="waiting-room-container"></div>
  </div>

  <script src="./public/waiting-room.js"></script>
  <script>
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('status').innerText = 'Exporting video... please wait.';
      const container = document.getElementById('waiting-room-container');
      container.style.display = 'block';

      OopsGames.startWaitingRoom({
        containerId: 'waiting-room-container',
        clientId: 'acme_test_123',
        onProceed: () => {
          container.style.display = 'none';
          document.getElementById('status').innerText = 'Export complete! Video saved to your files.';
          document.getElementById('status').style.color = '#10b981';
        }
      });

      // Simulate a background task taking 10 seconds
      setTimeout(() => {
        OopsGames.notifyTaskComplete();
      }, 10000);
    });
  </script>
</body>
</html>
